<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>Pronos Mondial 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0e1a; --bg2:#11172b; --card:#161d33; --line:#26304d;
    --txt:#eef2ff; --mut:#8b95b5; --accent:#00e5a0; --accent2:#ff5d73;
    --gold:#ffd25a; --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0,229,160,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(255,93,115,.08), transparent 55%),
      var(--bg);
    color:var(--txt); font-family:"Bricolage Grotesque",system-ui,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 110px}
  h1,h2,h3{font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .mono{font-family:"Space Mono",monospace}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
  .brand .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#0bbf85);color:#04130c;font-size:20px;
    box-shadow:0 8px 24px rgba(0,229,160,.35)}
  .brand h1{font-size:21px}
  .brand small{color:var(--mut);font-size:12px;display:block;font-weight:500}

  .card{background:linear-gradient(180deg,var(--card),#131a2e);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.25)}
  label{font-size:12px;color:var(--mut);display:block;margin:0 0 6px;font-weight:600}
  input{width:100%;background:#0d1326;border:1px solid var(--line);color:var(--txt);
    padding:13px 14px;border-radius:12px;font-size:16px;font-family:inherit;outline:none}
  input:focus{border-color:var(--accent)}
  .btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--accent),#0bbf85);
    color:#04130c;transition:transform .06s, opacity .2s}
  .btn:active{transform:scale(.985)} .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.sm{width:auto;padding:9px 14px;font-size:13px}
  .link{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
  .err{color:var(--accent2);font-size:13px;margin-top:10px}
  .ok{color:var(--accent);font-size:13px;margin-top:10px}

  /* tabs */
  .tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,.92);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:20}
  .tabs .inner{max-width:560px;margin:0 auto;display:flex;width:100%}
  .tab{flex:1;background:none;border:none;color:var(--mut);padding:11px 4px 16px;
    font:inherit;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px}
  .tab.active{color:var(--accent)} .tab .ic{font-size:21px}

  /* match card */
  .stage-h{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;color:var(--mut);
    font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .stage-h::after{content:"";flex:1;height:1px;background:var(--line)}
  .match{padding:14px}
  .match .meta{display:flex;justify-content:space-between;align-items:center;
    font-size:11px;color:var(--mut);margin-bottom:12px;font-weight:600}
  .badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em}
  .badge.live{background:rgba(255,93,115,.16);color:var(--accent2)}
  .badge.locked{background:rgba(139,149,181,.15);color:var(--mut)}
  .badge.open{background:rgba(0,229,160,.14);color:var(--accent)}
  .badge.done{background:rgba(255,210,90,.16);color:var(--gold)}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .team .flag{font-size:30px;line-height:1}
  .team .nm{font-size:13px;font-weight:700}
  .score-in{display:flex;align-items:center;gap:6px;justify-content:center}
  .score-in input{width:46px;text-align:center;font-size:20px;font-weight:700;padding:8px 0;
    font-family:"Space Mono",monospace}
  .vs{color:var(--mut);font-weight:700;font-size:13px}
  .realscore{font-family:"Space Mono",monospace;font-size:22px;font-weight:700;text-align:center}
  .pts{margin-top:11px;text-align:center;font-size:12px;font-weight:700}
  .pts.win{color:var(--accent)} .pts.zero{color:var(--mut)}
  .saverow{display:flex;gap:8px;margin-top:12px;align-items:center}
  .saved-tag{font-size:11px;color:var(--accent);font-weight:600}

  /* leaderboard */
  .lb-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
    border-radius:14px;margin-bottom:8px;background:var(--card)}
  .lb-row.me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .rank{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;
    font-family:"Space Mono",monospace;font-size:14px;background:#0d1326;color:var(--mut);flex:0 0 auto}
  .rank.g1{background:linear-gradient(135deg,#ffe07a,#f5b400);color:#3a2a00}
  .rank.g2{background:linear-gradient(135deg,#e8edf7,#aab4c9);color:#2a3142}
  .rank.g3{background:linear-gradient(135deg,#e9a877,#c97b3d);color:#3a1e00}
  .lb-name{flex:1;font-weight:700;font-size:15px}
  .lb-sub{font-size:11px;color:var(--mut);font-weight:500}
  .lb-pts{font-family:"Space Mono",monospace;font-weight:700;font-size:18px;color:var(--accent)}

  .muted{color:var(--mut);font-size:13px;line-height:1.5}
  .center{text-align:center}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pill-info{font-size:11px;color:var(--mut);margin-top:6px}
  .rules{font-size:12.5px;color:var(--mut);line-height:1.7}
  .rules b{color:var(--txt)}
  hr{border:none;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div id="root"></div>

<!-- ================= CONFIG SUPABASE ================= -->
<script>
  /* ⬇️  REMPLACE CES DEUX VALEURS par celles de ton projet Supabase
         (Settings > API : "Project URL" et "anon public key").     */
  window.SUPABASE_URL  = "https://nrgrtokjjztlmygbkyqk.supabase.co";
  window.SUPABASE_ANON  = "sb_publishable_2maazN0nRZD-XJaioNzZhA_Ic-HyQcY";
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON);

const STAGES = {
  group:"Phase de groupes", r32:"16es de finale", r16:"8es de finale",
  qf:"Quarts de finale", sf:"Demi-finales", final:"Finale"
};
const STAGE_ORDER = ["group","r32","r16","qf","sf","final"];
const isHigh = s => ["qf","sf","final"].includes(s);

/* Drapeaux emoji par pays (clés en minuscules). On reconnaît le nom anglais
   renvoyé par API-Football ET le nom français courant. */
const FLAGS = {
  "qatar":"🇶🇦","ecuador":"🇪🇨","équateur":"🇪🇨","equateur":"🇪🇨","senegal":"🇸🇳","sénégal":"🇸🇳",
  "netherlands":"🇳🇱","pays-bas":"🇳🇱","england":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","angleterre":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","iran":"🇮🇷","usa":"🇺🇸",
  "united states":"🇺🇸","etats-unis":"🇺🇸","états-unis":"🇺🇸","wales":"🏴󠁧󠁢󠁷󠁬󠁳󠁿","pays de galles":"🏴󠁧󠁢󠁷󠁬󠁳󠁿",
  "argentina":"🇦🇷","argentine":"🇦🇷","saudi arabia":"🇸🇦","arabie saoudite":"🇸🇦","mexico":"🇲🇽","mexique":"🇲🇽",
  "poland":"🇵🇱","pologne":"🇵🇱","france":"🇫🇷","australia":"🇦🇺","australie":"🇦🇺","denmark":"🇩🇰","danemark":"🇩🇰",
  "tunisia":"🇹🇳","tunisie":"🇹🇳","spain":"🇪🇸","espagne":"🇪🇸","costa rica":"🇨🇷","germany":"🇩🇪","allemagne":"🇩🇪",
  "japan":"🇯🇵","japon":"🇯🇵","belgium":"🇧🇪","belgique":"🇧🇪","canada":"🇨🇦","morocco":"🇲🇦","maroc":"🇲🇦",
  "croatia":"🇭🇷","croatie":"🇭🇷","brazil":"🇧🇷","brésil":"🇧🇷","bresil":"🇧🇷","serbia":"🇷🇸","serbie":"🇷🇸",
  "switzerland":"🇨🇭","suisse":"🇨🇭","cameroon":"🇨🇲","cameroun":"🇨🇲","portugal":"🇵🇹","ghana":"🇬🇭",
  "uruguay":"🇺🇾","south korea":"🇰🇷","korea republic":"🇰🇷","corée du sud":"🇰🇷","coree du sud":"🇰🇷",
  "italy":"🇮🇹","italie":"🇮🇹","colombia":"🇨🇴","colombie":"🇨🇴","norway":"🇳🇴","norvège":"🇳🇴","norvege":"🇳🇴",
< truncated lines 153-499 >
      kickoff:iso, stage:f.stage, status:"scheduled"
    });
    if(error) setMsg("err:"+error.message);
    else { setMsg("ok:Match ajouté."); setF({home_team:"",away_team:"",kickoff:"",stage:"group"}); load(); }
  }

  async function saveScore(m, hs, as, finish){
    setMsg("");
    const upd = { home_score: hs===""?null:+hs, away_score: as===""?null:+as,
                  status: finish ? "finished" : "scheduled" };
    const { error } = await sb.from("matches").update(upd).eq("id",m.id);
    if(error) setMsg("err:"+error.message);
    else { setMsg("ok:Score enregistré — points recalculés."); load(); }
  }

  async function delMatch(m){
    if(!confirm(`Supprimer ${m.home_team} – ${m.away_team} ?`)) return;
    const { error } = await sb.from("matches").delete().eq("id",m.id);
    if(error) setMsg("err:"+error.message); else load();
  }

  if(!matches) return <div className="spin"/>;

  return (
    <div className="wrap">
      <div className="brand"><div className="dot">🛠️</div>
        <div><h1>Admin</h1><small>Gestion des matchs & scores</small></div></div>

      <div className="row2" style={{marginBottom:6}}>
        {[["scores","Scores"],["add","Ajouter un match"]].map(([k,l])=>(
          <button key={k} className="btn ghost sm" style={{width:"100%",
            borderColor:tab===k?"var(--accent)":"var(--line)",
            color:tab===k?"var(--accent)":"var(--txt)"}} onClick={()=>setTab(k)}>{l}</button>
        ))}
      </div>

      {msg.startsWith("ok:") && <div className="ok" style={{marginBottom:10}}>{msg.slice(3)}</div>}
      {msg.startsWith("err:") && <div className="err" style={{marginBottom:10}}>{msg.slice(4)}</div>}

      {tab==="add" && (
        <div className="card">
          <label>Équipe à domicile</label>
          <input value={f.home_team} onChange={e=>setF({...f,home_team:e.target.value})} placeholder="France"/>
          <div style={{height:10}}/>
          <label>Équipe à l'extérieur</label>
          <input value={f.away_team} onChange={e=>setF({...f,away_team:e.target.value})} placeholder="Brazil"/>
          <div style={{height:10}}/>
          <label>Date & heure du coup d'envoi (ton heure locale)</label>
          <input type="datetime-local" value={f.kickoff} onChange={e=>setF({...f,kickoff:e.target.value})}/>
          <div style={{height:10}}/>
          <label>Phase</label>
          <select value={f.stage} onChange={e=>setF({...f,stage:e.target.value})}
            style={{width:"100%",background:"#0d1326",border:"1px solid var(--line)",color:"var(--txt)",
                    padding:"13px 14px",borderRadius:12,fontSize:16,fontFamily:"inherit"}}>
            {STAGE_ORDER.map(s=><option key={s} value={s}>{STAGES[s]}{isHigh(s)?" (barème ↑)":""}</option>)}
          </select>
          <div className="pill-info">Astuce : écris les noms en anglais (France, Brazil, Spain…) pour que les drapeaux s'affichent automatiquement.</div>
          <div style={{height:14}}/>
          <button className="btn" onClick={addMatch}>Ajouter ce match</button>
        </div>
      )}

      {tab==="scores" && (
        matches.length===0
          ? <div className="card center muted">Aucun match. Ajoute-en un, ou importe le calendrier via l'API.</div>
          : matches.map(m=>(
            <AdminScoreRow key={m.id} m={m} onSave={saveScore} onDelete={delMatch}/>
          ))
      )}
    </div>
  );
}

function AdminScoreRow({m,onSave,onDelete}){
  const [hs,setHs]=useState(m.home_score==null?"":String(m.home_score));
  const [as,setAs]=useState(m.away_score==null?"":String(m.away_score));
  return (
    <div className="card" style={{padding:13}}>
      <div className="meta" style={{marginBottom:8}}>
        <span>{fmtDate(m.kickoff)} · {STAGES[m.stage]}</span>
        {m.status==="finished" ? <span className="badge done">Terminé</span> : <span className="badge open">{m.status}</span>}
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{flex:"1 1 40%",fontWeight:700,fontSize:13}}>
          {flagFor(m.home_team,m.home_flag)} {m.home_team}</span>
        <input type="number" inputMode="numeric" value={hs} onChange={e=>setHs(e.target.value)}
          style={{width:44,textAlign:"center"}}/>
        <span className="vs">–</span>
        <input type="number" inputMode="numeric" value={as} onChange={e=>setAs(e.target.value)}
          style={{width:44,textAlign:"center"}}/>
        <span style={{flex:"1 1 40%",fontWeight:700,fontSize:13,textAlign:"right"}}>
          {m.away_team} {flagFor(m.away_team,m.away_flag)}</span>
      </div>
      <div className="saverow">
        <button className="btn sm" onClick={()=>onSave(m,hs,as,true)} disabled={hs===""||as===""}>
          Valider (terminé)</button>
        <button className="btn ghost sm" onClick={()=>onSave(m,hs,as,false)}>Enregistrer sans clore</button>
        <button className="link" style={{color:"var(--accent2)"}} onClick={()=>onDelete(m)}>Suppr.</button>
      </div>
    </div>
  );
}

/* ---------------- APP ---------------- */
function App(){
  const [session,setSession]=useState(undefined);
  const [profile,setProfile]=useState(null);
  const [tab,setTab]=useState("matches");

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub } = sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{
    if(session?.user){
      sb.from("profiles").select("*").eq("id",session.user.id).single()
        .then(({data})=>setProfile(data));
    }else setProfile(null);
  },[session]);

  if(session===undefined) return <div className="spin"/>;
  if(!session) return <Auth/>;

  const uid=session.user.id;
  const admin = !!profile?.is_admin;
  return (
    <>
      {tab==="matches" && <Matches userId={uid}/>}
      {tab==="board"   && <Board userId={uid}/>}
      {tab==="rules"   && <Rules profile={profile} onSignOut={()=>sb.auth.signOut()}/>}
      {tab==="admin" && admin && <Admin/>}
      <nav className="tabs"><div className="inner">
        <button className={"tab"+(tab==="matches"?" active":"")} onClick={()=>setTab("matches")}>
          <span className="ic">⚽</span>Matchs</button>
        <button className={"tab"+(tab==="board"?" active":"")} onClick={()=>setTab("board")}>
          <span className="ic">🏆</span>Classement</button>
        <button className={"tab"+(tab==="rules"?" active":"")} onClick={()=>setTab("rules")}>
          <span className="ic">📋</span>Règles</button>
        {admin && (
          <button className={"tab"+(tab==="admin"?" active":"")} onClick={()=>setTab("admin")}>
            <span className="ic">🛠️</span>Admin</button>
        )}
      </div></nav>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
